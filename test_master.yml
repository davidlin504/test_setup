services:
  test_master:
    build:
      dockerfile: Dockerfile         # 指向當前目錄下的 Dockerfile
    image: spx_master:v1.25
    container_name: my_spx_master_v1.25
    hostname: spx_master
    stdin_open: true
    tty: true
    restart: no
    ports:
    #   - "2222:22"
    #   - "1111:111"
        - "2222:2222"
    network_mode: "host"
    privileged: true  # 執行 rpcbind 建議開啟
    environment:
      - DISPLAY=:0
      - GIT_ACCOUNT=stanley
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      # - ${HOME}/Desktop/spx_sandbox/output:/output
      # - ${HOME}/Desktop/spx_sandbox/results:/myvol
      # - ${HOME}/Desktop/spx_taas_v1.25/Tests:/Tests